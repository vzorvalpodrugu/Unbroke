{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-5"
         style="background-color:#0d1b2a; border:1px solid #000; border-radius:20px; width:550px;">

        <form method="post" enctype="multipart/form-data" id="statementForm">
            {% csrf_token %}

            <!-- Select Bank -->
            <div class="mb-4">
                <label class="form-label text-light fw-semibold">Банк</label>
                <div class="position-relative">
                    <button class="btn w-100 d-flex align-items-center justify-content-between bank-select"
                            type="button" id="bankDropdownBtn">
                        <span class="d-flex align-items-center">
                            <img id="selectedBankIcon" src="{% static 'icons/tbank.png' %}" class="me-2" style="width:28px; height:28px;">
                            <span id="selectedBankText">Tbank</span>
                        </span>
                        <i class="bi bi-chevron-down text-light"></i>
                    </button>

                    <ul class="bank-dropdown list-unstyled p-0 m-0 shadow">
						<li class="bank-option d-flex align-items-center p-2" data-value="1">
							<img src="{% static 'icons/tbank.png' %}" class="me-2" style="width:24px; height:24px;">Tbank
						</li>
						<li class="bank-option d-flex align-items-center p-2" data-value="2">
							<img src="{% static 'icons/sberbank.png' %}" class="me-2" style="width:24px; height:24px;">Sberbank
						</li>
						<li class="bank-option d-flex align-items-center p-2" data-value="3">
							<img src="{% static 'icons/alphabank.png' %}" class="me-2" style="width:24px; height:24px;">AlphaBank
						</li>
						<li class="bank-option d-flex align-items-center p-2" data-value="4">
							<img src="{% static 'icons/vtb.png' %}" class="me-2" style="width:24px; height:24px;">VTB
						</li>
						<li class="bank-option d-flex align-items-center p-2" data-value="5">
							<img src="{% static 'icons/gazprombank.png' %}" class="me-2" style="width:24px; height:24px;">Gazprombank
						</li>
					</ul>
					
					<input type="hidden" name="bank" id="bankInput" value="1"> <!-- id Bank -->
					
                </div>
            </div>

            <!-- File Upload -->
            <div class="mb-4">
                <label class="form-label text-light fw-semibold">Загрузите выписку</label>
                <div class="upload-box d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-upload text-light fs-1 mb-2"></i>
                    <span class="upload-text text-light">Перетащите файл или выберите вручную</span>
                    <i class="bi bi-check-circle-fill text-success fs-2 mt-2 d-none" id="fileCheck"></i>
                    <input class="file-input" type="file" name="file" accept=".csv,.xlsx,.xls">
                </div>
            </div>

            <!-- Button -->
            <div class="text-center">
                <button type="submit" class="btn btn-success px-5 py-2 rounded-pill fw-semibold">
                    Анализ
                </button>
            </div>
			
        </form>
    </div>
	<div id="formSuccessOverlay" class="d-none">
    <div class="checkmark-container">
        <div class="checkmark-circle">
            <svg viewBox="0 0 52 52">
                <path d="M14 27l7 7 16-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>
</div>
</div>
<!-- Блок прогресса -->
<div id="analysisProgress" class="d-flex justify-content-center align-items-center vh-100 d-none">
    <div class="card shadow-lg p-5 text-center position-relative"
         style="background-color:#0d1b2a; border:1px solid #000; border-radius:20px; width:550px;">

        <!-- Текущий статус страницы -->
        <div id="statusText" class="mb-3 text-light" style="min-height:28px; font-size:18px;"></div>

        <!-- Контейнер для завершённых страниц -->
        <div id="completedPages" class="text-start mb-4"></div>

        <!-- Крутящийся кружок -->
        <div class="d-flex justify-content-end">
            <div class="spinner">
                <div class="spinner-circle"></div>
            </div>
        </div>

    </div>
</div>


        <!-- Лог шагов -->
        <div id="progressLog" class="text-light small text-start"
             style="font-family:monospace; background:#152a44; border-radius:12px; padding:12px; height:140px; overflow:auto;">
            ▶ Ожидание запуска...
        </div>
    </div>
</div>

<style>
/* Dropdown styles */
.bank-select {
    background: rgba(255,255,255,0.1);
    border: 1px solid #444;
    border-radius: 12px;
    padding: 12px;
    color: #fff;
    width: 100%;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.3s ease;
}
.bank-select:hover {
    background: rgba(0,123,255,0.15);
    border-color: #007bff;
}

/* Белый текст выбранного банка всегда */
.bank-select span#selectedBankText {
    color: #fff;
}

/* Dropdown list */
.bank-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background-color: #152a44;
    border-radius: 12px;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.4s ease, opacity 0.4s ease;
    z-index: 10;
}
.bank-dropdown.show {
    max-height: 500px;
    opacity: 1;
}

/* Dropdown options */
.bank-dropdown .bank-option {
    transition: background 0.3s;
    cursor: pointer;
    color: #fff;
    border-bottom: none; /* убрали полосы между банками */
}
.bank-dropdown .bank-option:hover {
    background: rgba(0,123,255,0.15);
}

/* Upload box */
.upload-box {
    border: 2px dashed #444;
    border-radius: 15px;
    padding: 30px;
    text-align: center;
    cursor: pointer;
    background: rgba(255,255,255,0.05);
    transition: background 0.3s ease-in-out, border-color 0.3s, box-shadow 0.3s;
    position: relative;
}
.upload-box:hover {
    background: rgba(0,123,255,0.15);
    border-color: #007bff;
    box-shadow: 0 0 15px rgba(0,123,255,0.3);
}
.upload-text {
    transition: color 0.2s ease-in-out;
}
.upload-box:hover .upload-text {
    color: #00bfff;
    font-weight: 500;
}

.file-input {
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
}

#fileCheck {
    transition: all 0.5s ease-in-out;
}
/* Круглый прогресс */
.progress-circle {
    position: relative;
    width: 160px;
    height: 160px;
}
.progress-ring__circle {
    stroke-dasharray: 427; /* 2πr при r=68 */
    stroke-dashoffset: 427;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    transition: stroke-dashoffset 0.5s ease;
}
.progress-ring__circle-bg {
    opacity: 0.2;
}
.progress-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 22px;
}
/*Для зеленой кнопки*/
#statementForm.dimmed {
    opacity: 0.5;
    pointer-events: none;
    transition: opacity 0.5s ease;
}

#formSuccessOverlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
}

.checkmark-container {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Галочка */
.checkmark-circle {
    width: 160px;   /* было 80px → увеличили в 2 раза */
    height: 160px;
    border-radius: 50%;
    background: #28a745; /* ярко-зелёный */
    display: flex;
    justify-content: center;
    align-items: center;
    animation: popIn 0.5s ease forwards;
    box-shadow: 0 0 20px rgba(40, 167, 69, 0.7); /* сияние */
}

.checkmark-circle svg {
    width: 80px;   /* в 2 раза больше */
    height: 80px;
}

@keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    80% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
}
/* Крутящийся кружок */
.spinner {
    width: 60px;
    height: 60px;
    margin-left: 10px;
    position: relative;
}
.spinner-circle {
    width: 100%;
    height: 100%;
    border: 6px solid rgba(0,191,255,0.2);
    border-top-color: #00bfff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Галочка зелёная с анимацией сдвига */
.completed-page {
    display: flex;
    align-items: center;
    margin-bottom: 6px;
    opacity: 0;
    transform: translateX(-50px); /* начальное смещение влево */
    transition: all 0.5s ease;
    color: #fff; /* белый текст */
    font-size: 18px; /* увеличенный размер */
    font-weight: 500;
}

.completed-page.visible {
    opacity: 1;
    transform: translateX(0); /* плавное появление */
}
.completed-page svg {
    width: 20px;
    height: 20px;
    margin-right: 8px;
    stroke: #28a745;
    stroke-width: 4;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* Статус текст */
#statusText {
    font-size: 20px;
    color: #00bfff;
    font-weight: 500;
    min-height: 28px; /* чтобы текст не прыгал */
}
#completedPages {
    transition: all 1.5s ease; /* плавное изменение размера контейнера */
}

</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("statementForm");
    const progressCard = document.getElementById("analysisProgress");
    const completedContainer = document.getElementById("completedPages");
    const spinner = document.querySelector(".spinner-circle");
    const formSuccessOverlay = document.getElementById("formSuccessOverlay");
    const statusText = document.getElementById("statusText");

    form.addEventListener("submit", function(e) {
        e.preventDefault();
        const formData = new FormData(form);

        fetch("{% url 'statement_upload' %}", { method: "POST", body: formData })
        .then(r => r.json())
        .then(data => {
            const taskId = data.task_id;

            // Затемняем форму и показываем белую галочку
            form.classList.add("dimmed");
            formSuccessOverlay.classList.remove("d-none");

            setTimeout(() => {
                progressCard.classList.remove("d-none");
                progressCard.scrollIntoView({ behavior: "smooth", block: "center" });
            }, 500);

            let lastPage = 0;

            const interval = setInterval(() => {
                fetch(`/progress/${taskId}/`)
                .then(r => r.json())
                .then(p => {
                    console.log("Прогресс с сервера:", p); // 🔹 дебаг

                    if (!statusText) return;

                    // Обновляем текущий статус
                    if (p.current && p.total && p.current > lastPage) {
                        statusText.textContent = `Анализ страницы ${p.current}...`;
                    }

                    // Добавляем новые завершённые страницы с анимацией
                    if (p.pages_done && Array.isArray(p.pages_done)) {
						p.pages_done.forEach(pageNum => {
							// 🔹 проверяем реально ли элемент уже есть
							if (!document.getElementById(`page-${pageNum}`)) {
								const div = document.createElement("div");
								div.id = `page-${pageNum}`;
								div.className = "completed-page";
								div.innerHTML = `<svg viewBox="0 0 52 52">
									<path d="M14 27l7 7 16-16"/>
								</svg> Страница ${pageNum}`;
								completedContainer.appendChild(div);
					
								// 🔹 двойной requestAnimationFrame для плавного сдвига
								requestAnimationFrame(() => {
									requestAnimationFrame(() => div.classList.add("visible"));
								});
							}
						});
					}

                    // Когда всё завершено
                    if (p.done) {
                        clearInterval(interval);
                        spinner.style.display = "none";
                        statusText.textContent = "Готовим ответ для Вас!";
                        setTimeout(() => {
                            statusText.textContent = "✅ Анализ завершен!";
                        }, 1000);
                    }
                })
                .catch(err => console.error("Ошибка fetch прогресса:", err));
            }, 1000);
        })
        .catch(err => console.error("Ошибка submit формы:", err));
    });

    // Банковский dropdown
    const bankBtn = document.getElementById('bankDropdownBtn');
    const bankDropdown = document.querySelector('.bank-dropdown');
    const bankInput = document.getElementById('bankInput');
    const selectedBankText = document.getElementById('selectedBankText');
    const selectedBankIcon = document.getElementById('selectedBankIcon');

    bankBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        bankDropdown.classList.toggle('show');
    });

    document.querySelectorAll('.bank-option').forEach(option => {
        option.addEventListener('click', () => {
            const value = option.getAttribute('data-value');
            const text = option.innerText.trim();
            const img = option.querySelector('img').getAttribute('src');
            bankInput.value = value;
            selectedBankText.innerText = text;
            selectedBankIcon.src = img;
            bankDropdown.classList.remove('show');
        });
    });

    document.addEventListener('click', (e) => {
        if(!bankBtn.contains(e.target) && !bankDropdown.contains(e.target)) {
            bankDropdown.classList.remove('show');
        }
    });

    // Upload box
    document.querySelectorAll('.upload-box').forEach(box => {
        const fileInput = box.querySelector('.file-input');
        const uploadText = box.querySelector('.upload-text');
        const fileCheck = box.querySelector('#fileCheck');
        let clickLock = false;

        box.addEventListener('click', e => {
            if (!clickLock) {
                clickLock = true;
                fileInput.click();
            }
        });

        fileInput.addEventListener('click', e => e.stopPropagation());

        fileInput.addEventListener('change', () => {
            clickLock = false;
            if (fileInput.files.length > 0) {
                uploadText.textContent = fileInput.files[0].name;
                fileCheck.classList.remove('d-none');
                fileCheck.style.transform = 'scale(1.3)';
                setTimeout(()=> fileCheck.style.transform='scale(1)', 300);
            } else {
                uploadText.textContent = "Перетащите файл или выберите вручную";
                fileCheck.classList.add('d-none');
            }
        });
    });
});
</script>



{% endblock %}
