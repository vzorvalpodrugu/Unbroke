{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4 glass-card text-center"
         style="background: rgba(13, 27, 42, 0.9); border:1px solid #f72585; border-radius:20px; width:500px;">
        
        <div class="mb-4">
            <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
        </div>
        
        <h4 class="text-light mb-3">Удаление выписки</h4>
        <p class="text-secondary mb-4">Вы уверены, что хотите удалить выписку "{{ object.filename }}"?</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'profile' %}" class="btn btn-outline-secondary rounded-pill px-4">Отмена</a>
                <button type="submit" class="btn btn-outline-danger rounded-pill px-4">Удалить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
