{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-5"
         style="background-color:#0d1b2a; border:1px solid #000; border-radius:20px; width:550px;">

        <form method="post" enctype="multipart/form-data" id="statementForm">
            {% csrf_token %}

            <!-- Select Bank -->
            <div class="mb-4">
                <label class="form-label text-light fw-semibold">Банк</label>
                <div class="position-relative">
                    <button class="btn w-100 d-flex align-items-center justify-content-between bank-select"
                            type="button" id="bankDropdownBtn">
                        <span class="d-flex align-items-center">
                            <img id="selectedBankIcon" src="{% static 'icons/tbank.png' %}" class="me-2" style="width:28px; height:28px;">
                            <span id="selectedBankText">Tbank</span>
                        </span>
                        <i class="bi bi-chevron-down text-light"></i>
                    </button>

                    <ul class="bank-dropdown list-unstyled p-0 m-0 shadow">
						<li class="bank-option d-flex align-items-center p-2" data-value="1">
							<img src="{% static 'icons/tbank.png' %}" class="me-2" style="width:24px; height:24px;">Tbank
						</li>
						<li class="bank-option d-flex align-items-center p-2" data-value="2">
							<img src="{% static 'icons/sberbank.png' %}" class="me-2" style="width:24px; height:24px;">Sberbank
						</li>
						<li class="bank-option d-flex align-items-center p-2" data-value="3">
							<img src="{% static 'icons/alphabank.png' %}" class="me-2" style="width:24px; height:24px;">AlphaBank
						</li>
						<li class="bank-option d-flex align-items-center p-2" data-value="4">
							<img src="{% static 'icons/vtb.png' %}" class="me-2" style="width:24px; height:24px;">VTB
						</li>
						<li class="bank-option d-flex align-items-center p-2" data-value="5">
							<img src="{% static 'icons/gazprombank.png' %}" class="me-2" style="width:24px; height:24px;">Gazprombank
						</li>
					</ul>
					
					<input type="hidden" name="bank" id="bankInput" value="1"> <!-- id Bank -->
					
                </div>
            </div>

            <!-- File Upload -->
            <div class="mb-4">
                <label class="form-label text-light fw-semibold">Загрузите выписку</label>
                <div class="upload-box d-flex flex-column justify-content-center align-items-center">
                    <i class="bi bi-upload text-light fs-1 mb-2"></i>
                    <span class="upload-text text-light">Перетащите файл или выберите вручную</span>
                    <i class="bi bi-check-circle-fill text-success fs-2 mt-2 d-none" id="fileCheck"></i>
                    <input class="file-input" type="file" name="file" accept=".csv,.xlsx,.xls">
                </div>
            </div>

            <!-- Button -->
            <div class="text-center">
                <button type="submit" class="btn btn-success px-5 py-2 rounded-pill fw-semibold">
                    Анализ
                </button>
            </div>
			
        </form>
    </div>
	<div id="formSuccessOverlay" class="d-none">
    <div class="checkmark-container">
        <div class="checkmark-circle">
            <svg viewBox="0 0 52 52">
                <path d="M14 27l7 7 16-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>
</div>
</div>
<!-- Блок прогресса -->
<div id="analysisProgress" class="d-flex justify-content-center align-items-center vh-100 d-none">
    <div class="card shadow-lg p-5 text-center position-relative progress-card-dark"
         style="background: linear-gradient(135deg, #0d1b2a 0%, #1b3a4b 100%); border:1px solid #1e3a5f; border-radius:20px; width:550px;">

        <!-- Заголовок -->
        <div class="progress-header mb-4">
            <h4 class="text-light mb-1">Анализ выписки</h4>
            <p class="text-primary" style="color: #4cc9f0 !important;">Обрабатываем данные...</p>
        </div>

        <!-- Прогресс-бар -->
        <div class="progress-container mb-4">
            <div class="progress-bar-custom">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-percent text-light mt-2" id="progressPercent">0%</div>
        </div>

        <!-- Текущий статус -->
        <div class="status-container mb-4">
            <div class="status-indicator">
                <div class="status-pulse"></div>
            </div>
            <div id="statusText" class="status-text text-light">Подготовка к анализу</div>
        </div>

        <!-- Завершенные страницы -->
        <div class="pages-section">
            <div class="pages-header d-flex justify-content-between align-items-center mb-3">
                <span class="text-light">Обработанные страницы</span>
                <span class="text-primary" id="pagesCount" style="color: #4cc9f0 !important;">0/0</span>
            </div>
            <div id="completedPages" class="pages-list"></div>
        </div>

        <!-- Спиннер -->
        <div class="spinner-container">
            <div class="spinner">
                <div class="spinner-circle"></div>
            </div>
        </div>
    </div>
</div>


<style>
/* Dropdown styles */
.bank-select {
    background: rgba(255,255,255,0.1);
    border: 1px solid #444;
    border-radius: 12px;
    padding: 12px;
    color: #fff;
    width: 100%;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.3s ease;
}
.bank-select:hover {
    background: rgba(0,123,255,0.15);
    border-color: #007bff;
}

/* Белый текст выбранного банка всегда */
.bank-select span#selectedBankText {
    color: #fff;
}

/* Dropdown list */
.bank-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background-color: #152a44;
    border-radius: 12px;
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.4s ease, opacity 0.4s ease;
    z-index: 10;
}
.bank-dropdown.show {
    max-height: 500px;
    opacity: 1;
}

/* Dropdown options */
.bank-dropdown .bank-option {
    transition: background 0.3s;
    cursor: pointer;
    color: #fff;
    border-bottom: none; /* убрали полосы между банками */
}
.bank-dropdown .bank-option:hover {
    background: rgba(0,123,255,0.15);
}

/* Upload box */
.upload-box {
    border: 2px dashed #444;
    border-radius: 15px;
    padding: 30px;
    text-align: center;
    cursor: pointer;
    background: rgba(255,255,255,0.05);
    transition: background 0.3s ease-in-out, border-color 0.3s, box-shadow 0.3s;
    position: relative;
}
.upload-box:hover {
    background: rgba(0,123,255,0.15);
    border-color: #007bff;
    box-shadow: 0 0 15px rgba(0,123,255,0.3);
}
.upload-text {
    transition: color 0.2s ease-in-out;
}
.upload-box:hover .upload-text {
    color: #00bfff;
    font-weight: 500;
}

.file-input {
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
}

#fileCheck {
    transition: all 0.5s ease-in-out;
}
/* Круглый прогресс */
.progress-circle {
    position: relative;
    width: 160px;
    height: 160px;
}
.progress-ring__circle {
    stroke-dasharray: 427; /* 2πr при r=68 */
    stroke-dashoffset: 427;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    transition: stroke-dashoffset 0.5s ease;
}
.progress-ring__circle-bg {
    opacity: 0.2;
}
.progress-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 22px;
}
/*Для зеленой кнопки*/
#statementForm.dimmed {
    opacity: 0.5;
    pointer-events: none;
    transition: opacity 0.5s ease;
}

#formSuccessOverlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
}

.checkmark-container {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Галочка */
.checkmark-circle {
    width: 160px;   /* было 80px → увеличили в 2 раза */
    height: 160px;
    border-radius: 50%;
    background: #28a745; /* ярко-зелёный */
    display: flex;
    justify-content: center;
    align-items: center;
    animation: popIn 0.5s ease forwards;
    box-shadow: 0 0 20px rgba(40, 167, 69, 0.7); /* сияние */
}

.checkmark-circle svg {
    width: 80px;   /* в 2 раза больше */
    height: 80px;
}

@keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    80% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
}
/* Стили для прогресс-карточки */
.progress-card-dark {
    background: linear-gradient(135deg, #0d1b2a 0%, #1b3a4b 100%) !important;
    border: 1px solid #1e3a5f !important;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3) !important;
}

.progress-header h4 {
    font-weight: 600;
    font-size: 1.5rem;
}

/* Прогресс-бар */
.progress-bar-custom {
    width: 100%;
    height: 8px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4361ee, #4cc9f0);
    border-radius: 10px;
    width: 0%;
    transition: width 0.5s ease;
    box-shadow: 0 0 10px rgba(76, 201, 240, 0.4);
}

.progress-percent {
    font-weight: 600;
    font-size: 1.1rem;
}

/* Индикатор статуса */
.status-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    border: 1px solid rgba(76, 201, 240, 0.2);
}

.status-indicator {
    position: relative;
}

.status-pulse {
    width: 12px;
    height: 12px;
    background: #4cc9f0;
    border-radius: 50%;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% {
        box-shadow: 0 0 0 0 rgba(76, 201, 240, 0.7);
        transform: scale(1);
    }
    50% {
        transform: scale(1.1);
    }
    70% {
        box-shadow: 0 0 0 10px rgba(76, 201, 240, 0);
    }
    100% {
        box-shadow: 0 0 0 0 rgba(76, 201, 240, 0);
        transform: scale(1);
    }
}

.status-text {
    font-weight: 500;
    font-size: 1rem;
}

/* Секция страниц */
.pages-section {
    background: rgba(255, 255, 255, 0.03);
    border-radius: 12px;
    padding: 16px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 20px;
}

.pages-header {
    font-weight: 600;
}

/* Список страниц в столбик */
.pages-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 200px;
    overflow-y: auto;
    padding-right: 5px;
}

.pages-list::-webkit-scrollbar {
    width: 6px;
}

.pages-list::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
}

.pages-list::-webkit-scrollbar-thumb {
    background: #4cc9f0;
    border-radius: 3px;
}

/* Стили для завершенных страниц */
.completed-page {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    animation: slideIn 0.4s ease;
    transition: all 0.3s ease;
}

.completed-page:hover {
    background: rgba(255, 255, 255, 0.08);
    transform: translateX(5px);
}

.page-number {
    font-weight: 600;
}

/* Большая зеленая галочка */
.page-checkmark {
    width: 24px;
    height: 24px;
    color: #28a745;
    animation: checkmarkPop 0.5s ease;
}

@keyframes checkmarkPop {
    0% {
        transform: scale(0);
        opacity: 0;
    }
    50% {
        transform: scale(1.2);
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Контейнер спиннера */
.spinner-container {
    display: flex;
    justify-content: center;
    margin: 20px 0;
}

.spinner {
    width: 40px;
    height: 40px;
}

.spinner-circle {
    width: 100%;
    height: 100%;
    border: 3px solid rgba(76, 201, 240, 0.2);
    border-top: 3px solid #4cc9f0;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}


</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("statementForm");
    const progressCard = document.getElementById("analysisProgress");
    const completedContainer = document.getElementById("completedPages");
    const spinner = document.querySelector(".spinner-circle");
    const formSuccessOverlay = document.getElementById("formSuccessOverlay");
    const statusText = document.getElementById("statusText");

    form.addEventListener("submit", function(e) {
        e.preventDefault();
        const formData = new FormData(form);

        fetch("{% url 'statement_upload' %}", { method: "POST", body: formData })
        .then(r => r.json())
        .then(data => {
            const taskId = data.task_id;

            // Затемняем форму и показываем белую галочку
            form.classList.add("dimmed");
            formSuccessOverlay.classList.remove("d-none");

            setTimeout(() => {
                progressCard.classList.remove("d-none");
                progressCard.scrollIntoView({ behavior: "smooth", block: "center" });
                
                // 🔥 ВЫЗЫВАЕМ ФУНКЦИЮ ОТСЛЕЖИВАНИЯ ПРОГРЕССА
                trackProgress(taskId);
                
            }, 500);

            // Удаляем старый интервал отслеживания прогресса
            // (переносим логику в функцию trackProgress)
        })
        .catch(err => console.error("Ошибка submit формы:", err));
    });

    // Обновленная функция отслеживания прогресса
// Обновленная функция отслеживания прогресса
function trackProgress(taskId) {
    let lastPage = 0;
    let totalPages = 0;

    const interval = setInterval(() => {
        fetch(`/progress/${taskId}/`)
        .then(r => r.json())
        .then(p => {
            console.log("Прогресс с сервера:", p);

            // Обновляем прогресс-бар
            if (p.current && p.total) {
                totalPages = p.total;
                const progress = (p.current / p.total) * 100;
                document.getElementById('progressFill').style.width = `${progress}%`;
                document.getElementById('progressPercent').textContent = `${Math.round(progress)}%`;
                document.getElementById('pagesCount').textContent = `${p.current}/${p.total}`;
                
                // Обновляем статус текста
                if (statusText) {
                    statusText.textContent = `Анализ страницы ${p.current}...`;
                }
            }

            // Обновляем статус из ответа сервера (если есть)
            if (p.status && statusText) {
                statusText.textContent = p.status;
            }

            // Добавляем завершенные страницы
            if (p.pages_done && Array.isArray(p.pages_done)) {
                p.pages_done.forEach(pageNum => {
                    if (!document.getElementById(`page-${pageNum}`)) {
                        const div = document.createElement("div");
                        div.id = `page-${pageNum}`;
                        div.className = "completed-page";
                        div.innerHTML = `
                            <span class="page-number">Страница ${pageNum}</span>
                            <i class="bi bi-check-circle-fill page-checkmark"></i>
                        `;
                        completedContainer.appendChild(div);
                        
                        // Плавное появление
                        setTimeout(() => {
                            div.style.opacity = "1";
                            div.style.transform = "translateY(0)";
                        }, 50);
                    }
                });
            }

            // Завершение анализа
            if (p.done) {
                clearInterval(interval);
                if (spinner) spinner.style.display = "none";
                if (statusText) {
                    statusText.textContent = "Готовим ответ для Вас!";
                    setTimeout(() => {
                        statusText.textContent = "✅ Анализ завершен!";
                    }, 1000);
                }
            }
        })
        .catch(err => console.error("Ошибка получения прогресса:", err));
    }, 1000);
}

    // Остальной код (банковский dropdown, upload box) остается без изменений
    // Банковский dropdown
    const bankBtn = document.getElementById('bankDropdownBtn');
    const bankDropdown = document.querySelector('.bank-dropdown');
    const bankInput = document.getElementById('bankInput');
    const selectedBankText = document.getElementById('selectedBankText');
    const selectedBankIcon = document.getElementById('selectedBankIcon');

    bankBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        bankDropdown.classList.toggle('show');
    });

    document.querySelectorAll('.bank-option').forEach(option => {
        option.addEventListener('click', () => {
            const value = option.getAttribute('data-value');
            const text = option.innerText.trim();
            const img = option.querySelector('img').getAttribute('src');
            bankInput.value = value;
            selectedBankText.innerText = text;
            selectedBankIcon.src = img;
            bankDropdown.classList.remove('show');
        });
    });

    document.addEventListener('click', (e) => {
        if(!bankBtn.contains(e.target) && !bankDropdown.contains(e.target)) {
            bankDropdown.classList.remove('show');
        }
    });

    // Upload box
    document.querySelectorAll('.upload-box').forEach(box => {
        const fileInput = box.querySelector('.file-input');
        const uploadText = box.querySelector('.upload-text');
        const fileCheck = box.querySelector('#fileCheck');
        let clickLock = false;

        box.addEventListener('click', e => {
            if (!clickLock) {
                clickLock = true;
                fileInput.click();
            }
        });

        fileInput.addEventListener('click', e => e.stopPropagation());

        fileInput.addEventListener('change', () => {
            clickLock = false;
            if (fileInput.files.length > 0) {
                uploadText.textContent = fileInput.files[0].name;
                fileCheck.classList.remove('d-none');
                fileCheck.style.transform = 'scale(1.3)';
                setTimeout(()=> fileCheck.style.transform='scale(1)', 300);
            } else {
                uploadText.textContent = "Перетащите файл или выберите вручную";
                fileCheck.classList.add('d-none');
            }
        });
    });
});
</script>



{% endblock %}
